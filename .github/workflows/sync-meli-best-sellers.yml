name: Sincronizar más vendidos de Meli

on:
  schedule:
    - cron: '30 8 * * *'
      timezone: 'America/Santiago'

    - cron: '00 19 * * *'
      timezone: 'America/Santiago'
  workflow_dispatch:

concurrency:
  group: sync-meli-best-sellers
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    defaults:
      run:
        working-directory: backend
    outputs:
      updated: ${{ steps.sync_products.outputs.updated }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Sincronizar productos
        id: sync_products
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SCRAPEDO_TOKEN: ${{ secrets.SCRAPEDO_TOKEN }}
          MELI_BEST_SELLERS_LIMIT: '15'
          MELI_SYNC_ON_START: 'false'
          MELI_DIAGNOSTIC_FILE: 'meli-diagnostic.html'
        run: |
          set -e
          npm run sync:meli > sync-output.log 2>&1 || true
          cat sync-output.log
          node <<'NODE'
          const fs = require('fs');
          const output = fs.readFileSync('sync-output.log', 'utf8');
          const match = output.match(/\{[\s\S]*\}/);
          let updated = 0;
          if (match) {
            try {
              const data = JSON.parse(match[0]);
              if (data.updated !== undefined) {
                updated = data.updated;
              }
            } catch (e) {
              // ignore parse errors
            }
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `updated=${updated}\n`);
          NODE

      - name: Guardar diagnóstico de Meli
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: meli-diagnostic-${{ github.run_id }}
          path: backend/meli-diagnostic.html
          if-no-files-found: ignore
          retention-days: 3

  notify:
    if: always()
    needs: sync
    runs-on: ubuntu-latest
    steps:
      - name: Enviar correo de resumen
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          secure: true
          subject: "GitHub Actions - Sincronización Meli #${{ github.run_number }} - ${{ needs.sync.result }}"
          body: |
            Workflow: ${{ github.workflow }}
            Job: sync
            Resultado: ${{ needs.sync.result }}
            Productos actualizados: ${{ needs.sync.outputs.updated }}
            Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Commit: ${{ github.sha }}
          to: ${{ secrets.NOTIFICATION_EMAIL_TO }}
          from: ${{ secrets.NOTIFICATION_EMAIL_FROM }}
